name: receipt-claim-boundary

on:
  push:
    branches:
      - one/roots-origin-conflict-claim-v1-20260918
    paths:
      - "src/roots/model.py"
      - "src/roots/verification.py"
      - "tests/test_receipt_completeness.py"
      - ".github/workflows/receipt-claim-boundary.yml"
  pull_request:
    paths:
      - "src/roots/model.py"
      - "src/roots/verification.py"
      - "tests/test_receipt_completeness.py"
      - ".github/workflows/receipt-claim-boundary.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
