name: receipt-claim-boundary

on:
  push:
    branches:
      - main
    paths:
      - "src/roots/**"
      - "portfolio/**"
      - "tests/**"
      - ".github/workflows/receipt-claim-boundary.yml"
  pull_request:
    paths:
      - "src/roots/**"
      - "portfolio/**"
      - "tests/**"
      - ".github/workflows/receipt-claim-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
