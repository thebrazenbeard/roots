name: receipt-claim-boundary

on:
  push:
    branches:
      - main
    paths:
      - "src/roots/**"
      - "portfolio/**"
      - "tests/**"
      - ".github/workflows/receipt-claim-boundary.yml"
  pull_request:
    paths:
      - "src/roots/**"
      - "portfolio/**"
      - "tests/**"
      - ".github/workflows/receipt-claim-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
